[theme]
base = "light"
primaryColor = "#256B65"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F7"
textColor = "#243238"
borderColor = "#E3E7EE"
font = "sans serif"
baseFontSize = 15
headingFontSizes = ["1.75rem", "1.4rem", "1.15rem", "1rem", "1rem", "1rem"]
metricValueFontSize = "1.65rem"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
paddingTop = "1.5rem"
paddingBottom = "1rem"

[server]
address = "127.0.0.1"
maxUploadSize = 200

[browser]
gatherUsageStats = false
