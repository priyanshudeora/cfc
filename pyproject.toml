[project]
name = "cfc-marketing-video-agent"
version = "0.1.0"
description = "Local approval-driven marketing video studio"
requires-python = ">=3.14,<3.15"
dependencies = [
    "streamlit==1.67.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "pydantic==2.14.3",
    "requests==2.34.2",
    "pillow==13.0.0",
    "imageio-ffmpeg==0.8.1",
    "numpy==2.5.4",
    "soundfile==0.14.0",
    "python-dotenv==1.2.4",
    "graphviz==0.21",
    "psutil==7.2.2",
]

[dependency-groups]
test = ["pytest==9.2.0", "ruff==0.17.3"]
playwright = [{include-group = "test"}, "playwright==1.56.0"]
notebook = ["ipykernel==7.4.0", "ipywidgets==8.1.9", "jupyterlab>=4,<5"]

[tool.uv]
package = false
default-groups = []

# The standalone voice worker must remain valid Python 3.12.
[tool.ruff]
target-version = "py312"
